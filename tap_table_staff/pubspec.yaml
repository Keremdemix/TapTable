name: tap_table_staff
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.0.0
  
  flutter_colorpicker: ^1.1.0
  
  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3

  # Token saklama
  flutter_secure_storage: ^9.2.2

  # JWT decode (role/restaurantId claim okumak için)
  jwt_decoder: ^2.0.1

  # Model serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  
  image_picker: ^1.1.2
  image_cropper: ^8.0.0
  cached_network_image: ^3.3.1
  crop_your_image: ^2.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
   - assets/sounds/